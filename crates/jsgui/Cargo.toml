[package]
name = "jsgui"
description = "Live GUI for the Joulescope JS220"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

build = "build.rs"

[[bin]]
name = "jsgui"
path = "src/main.rs"

[dependencies]
js220 = { workspace = true }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_plot = "0.31"
log = "0.4"
env_logger = "0.11"
# Real xlsx, so a spreadsheet gets typed numbers rather than a renamed CSV.
rust_xlsxwriter = "0.100"
# Native save dialog; picking a file by typing a path into a text box is not
# what anyone expects from a desktop application.
rfd = "0.17"
# Decodes the window icon. Already in the tree by way of eframe.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version strings into the .exe.
winresource = "0.1"

[dev-dependencies]
# Reads the workbook back in the tests without trusting the writer that made
# it, so "it produced a file" is not mistaken for "a spreadsheet can open it".
zip = { version = "9", default-features = false, features = ["deflate"] }
